name: Build with Pack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: linux
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.9.6

      
