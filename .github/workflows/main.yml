name: Build with Pack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: linux
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.9.6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
 
      - name: Build with Pack
        run: pack build --publish icaroquintella/${{ github.event.repository.name }}:latest -t icaroquintella/${{ github.event.repository.name }}:${{ github.sha }}

      
